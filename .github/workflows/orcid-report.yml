name: ORCID report (one-off check)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pyyaml
      - name: Compare ORCID record with site
        env:
          SOURCE: orcid
          ORCID_ID: 0000-0003-1159-1582
          REPORT: "1"
        run: python scripts/scholar_sync.py
      - name: Push report to branch orcid-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b orcid-report
          git add -f sync_report.md
          git commit -m "ORCID report"
          git push -f origin orcid-report
